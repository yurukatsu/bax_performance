[project]
name = "bax-performance"
version = "0.1.0"
description = "BAX 出力のパフォーマンス集計と可視化"
readme = "README.md"
authors = [
    { name = "yurukatsu", email = "yuruyuru.kaihatsu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
]

[project.scripts]
bax-performance = "bax_performance:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
